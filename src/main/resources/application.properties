# ① アプリケーションの名前（Springが識別用に使う。ログなどに表示される）
spring.application.name=StudentManagementSystem
#mysqlの定義
# ② 接続先データベースの場所：自分のPC(localhost)のMySQL、ポート3306、student_managementというデータベース
spring.datasource.url=jdbc:mysql://localhost:3306/student_management
# ③ データベースにログインするユーザー名
spring.datasource.username=root
# ④ ログイン用パスワード。直接書かず、環境変数DB_PASSWORDの値を読み込む（パスワードをコードに残さないため）
spring.datasource.password=${DB_PASSWORD}
# ⑤ MySQLに接続するためのドライバー（接続用の部品）のクラス名
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#Mybatisの定義
# ⑥ DBの列名(kana_nameなどのスネークケース)を、Javaのフィールド名(kanaNameなどのキャメルケース)に自動で対応させる
mybatis.configuration.map-underscore-to-camel-case=true
# ⑦ MyBatisのマッパーXML（SQLを書いたファイル）を探す場所の指定：classpath内のmapperフォルダにある .xml ファイル
mybatis.mapper-locations=classpath*:/mapper/*.xml
