# 【このファイルについて】テストを実行するときだけ使われる設定ファイルです。
# 本番用(src/main/resources/application.properties)とは別に、テスト専用のデータベース(H2)につなぐように設定しています。
# （テストで本物のMySQLのデータを壊さないための工夫です）
# ① アプリケーションの名前（Springが識別用に使う。ログなどに表示される）
spring.application.name=StudentManagementSystem
# ② 起動時に、SQLファイル（テーブルを作る文など）を必ず実行する設定（always＝いつも実行）
spring.sql.init.mode=always
#H2の定義
# ③ 接続先データベースの場所：H2という、メモリ上だけで動くテスト用データベース。
#    mem:testdb は「testdb という名前で、メモリの中に作る（テストが終わると消える）」という意味。
#    MODE=MySQL は「MySQLと同じ書き方のSQLが使えるようにしてね」という指定
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
# ④ データベースにログインするユーザー名（H2の標準的な名前「sa」）
spring.datasource.username=sa
# ⑤ ログイン用パスワード。テスト用の入れ物なので、ここに直接書いている（本番用は環境変数DB_PASSWORDから読み込む）
spring.datasource.password=sa
# ⑥ H2に接続するためのドライバー（接続用の部品）のクラス名
spring.datasource.driver-class-name=org.h2.Driver
# ⑦ H2コンソール（ブラウザでデータベースの中身を見る画面）に関する設定
spring.h2.console.enabled=true
#Mybatisの定義
# ⑧ DBの列名(kana_nameなどのスネークケース)を、Javaのフィールド名(kanaNameなどのキャメルケース)に自動で対応させる
mybatis.configuration.map-underscore-to-camel-case=true
# ⑨ MyBatisのマッパーXML（SQLを書いたファイル）を探す場所の指定：classpath内のmapperフォルダにある .xml ファイル
mybatis.mapper-locations=classpath*:/mapper/*.xml